services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sisfo_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://sisfo_user:sisfo_password@db:3306/sisfo_alazhar
      - DB_CONNECTION_LIMIT=30
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_NAME=SISFO SDIA Cairo
      - DAILY_API_KEY=${DAILY_API_KEY:-}
      - NEXT_PUBLIC_DAILY_DOMAIN=${NEXT_PUBLIC_DAILY_DOMAIN:-}
      - ENABLE_DEMO_MODE=false
      - RATE_LIMIT_ENABLED=true
    volumes:
      - sisfo_uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: sisfo_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-connections=200
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password_here
      MYSQL_DATABASE: sisfo_alazhar
      MYSQL_USER: sisfo_user
      MYSQL_PASSWORD: sisfo_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secure_password_here"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  sisfo_uploads:
